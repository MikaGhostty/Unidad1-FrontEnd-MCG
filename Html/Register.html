<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuario</title>
  <link rel="stylesheet" href="/Html/Body/BodyRegister.css">
</head>
<body>
  <div class="register-card">
    <h1>Registro para Nuevo Usuario</h1>
    <form id="registerForm">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" name="nombre" required>
      <div class="invalid-feedback">El nombre es obligatorio</div>

      <label for="email">Correo</label>
      <input type="email" id="email" name="email" required>
      <div class="invalid-feedback">El email es obligatorio</div>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required minlength="8">
      <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres e incluir letras y números</div>

      <label for="confirmPassword">Repetir Contraseña</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>
      <div class="invalid-feedback">Las contraseñas deben coincidir</div>

      <label for="fecha">Fecha de Nacimiento (opcional)</label>
      <input type="date" id="fecha" name="fecha">

      <button type="submit">Registrarse</button>
    </form>
    <div id="errorBox"></div>
  </div>

  <nav class="login-link">
    <a href="/Html/login1.html">¿Ya tienes cuenta? Inicia sesión</a>
  </nav>

  <footer>
    <p>© 2026 Club Deportivo</p>
  </footer>

  <!-- Enlace al JS externo -->
  <script src="/Html/JSON/Register.js"></script>
</body>
</html>
